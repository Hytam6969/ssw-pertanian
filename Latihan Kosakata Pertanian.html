<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Latihan Kosakata Pertanian</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--tx:#1d2a1f;--mu:#6b7a6d;--ac:#2f7d46;--ok:#2f7d46;--no:#c0392b;--bd:#d9ddd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a15;--card:#1e271f;--tx:#e8efe6;--mu:#9aab9d;--ac:#5cc47a;--ok:#5cc47a;--no:#e8776a;--bd:#323f34;color-scheme:dark}}
:root[data-theme=dark]{--bg:#141a15;--card:#1e271f;--tx:#e8efe6;--mu:#9aab9d;--ac:#5cc47a;--ok:#5cc47a;--no:#e8776a;--bd:#323f34;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
button{cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs button{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px 16px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.big{font-size:32px;font-weight:600;word-break:break-word}
.sub{color:var(--mu);font-size:14px;margin-top:6px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{text-align:left;padding:12px}
.ok{background:var(--ok)!important;color:#fff!important}.no{background:var(--no)!important;color:#fff!important}
.acts{display:flex;gap:8px;margin-top:12px}.acts button{flex:1;padding:12px}
input[type=text],input:not([type]){width:100%;box-sizing:border-box;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:7px 4px;border-bottom:1px solid var(--bd)}
td:first-child{font-weight:600}.tick{cursor:pointer;text-align:right}
.msg{margin-top:10px;min-height:22px;font-weight:600}
</style></head><body><main>

<div class="row"><select id="cat"></select><select id="dir"><option value="0">Jepang → Indonesia</option><option value="1">Indonesia → Jepang</option></select></div>
<div id="prog"></div>
<div id="view"></div>
</main>

"Tanaman & Bunga":"かふん=Serbuk Sari;さいばい=Pertumbuhan Tanaman;かんがい=Irigasi;ねっちゅうしょう=Sengatan Panas;からす=Gagak;うんか=Wareng;いもむし=Ulat Tanduk;ちゃどくが=Ulat Bulu;よとうが=Ngengat;てんとうむし=Kepik;アブラむし=Kutu Daun;くうしんさい=Kangkung;インゲンまめ=Buncis;おさまめ=Kacang Panjang;えだまめ=Edamame;そらまめ=Kacang Koro;オクラ=Okra;かぶ=Lobak Bulat;レンコン=Renkon;アスパラガス=Asparagus;もやし=Tauge;エシャロット=Bawang Merah Kecil;パイナップル=Nanas;ドラゴンフルーツ=Buah Naga;ミニトマト=Tomat Cherry;ブルーベリー=Blueberry;かき=Kesemek;ミント=Daun Mint;ローズマリー=Daun Rosemary;パセリ=Daun Parsley;セロリ=Daun Seledri;タイム=Thymus;オレガノ=Oregano;しそ=Daun Shiso;うこん=Kunyit;コリアンダー=Ketumbar;こしょう=Merica;いも=Ubi;さといも=Ubi Talas;ゴボウ=Ubi Kayu;キャッサバ=Singkong;やまいも=Ubi Gunung;ひまわり=Bunga Matahari;ゆり=Bunga Lili;ラベンダー=Bunga Lavender;ばら=Bunga Mawar;きく=Bunga Krisan;シクラメン=Bunga Cyclamen;パンジー=Pansy;カーネーション=Bunga Anyelir;ようらん=Bunga Anggrek;かんようしょくぶつ=Tanaman Hias;はなや=Toko Bunga;しょくぶつえん=Kebun Raya;しょくぶつ=Tanaman",

"Perlengkapan & Bahan":"ひよけぼうし=Topi Penahan Matahari;ビニルてぶくろ=Sarung Tangan Vinil;あんぜんぐつ=Sepatu Pelindung;ネット=Jaring;とりよけネット=Jaring Anti Burung;しゃこうネット=Jaring Pelindung Cahaya;ぼうふうネット=Jaring Penghalang Angin;ぼうそうシート=Karpet Penghalang Gulma;かんれいしゃ=Jaring Pelindung Dingin;マルチ=Mulsa;なえぼうし=Penutup Bibit;ビニールハウス=Rumah Kaca Vinil;いくびょうポット=Pot Bibit;ペーパポット=Pot Kertas;プラグトレー=Kotak Pembibitan;トンネルパイプ=Pipa Tunel;ドローン=Drone;ゆうきひりょう=Pupuk Hayati;ふようど=Humus;でいたん=Gambut;のうやく=Pestisida;もくたん=Arang;パーライト=Parlit;ゼオライト=Zeolit;にゅうさんきん=Bahan Penyubur;こめぶくろ=Tas Beras;やさいぶくろ=Plastik Sayur;のうようロープ=Tali Pertanian;プラスチックようき=Kontainer Plastik;てさげカゴ=Keranjang Tangan;しゅうかくぶくろ=Tas Panen;コンクリートミキサー=Adukan Semen",
"Padi & Lainnya":"もちこめ=Beras Ketan;くずこめ=Beras Menir;あかいこめ=Beras Merah;こめ=Beras (Padi);もみ=Gabah;ぬか=Katul;いね=Pohon Padi;いねかり=Panen Padi;たうえき=Mesin Penanam Padi;コンバイン=Mesin Panen Padi;こむぎ=Gandum;だいず=Kedelai;さやえんどう=Kacang Kapri;くろ=Pematang Sawah;ゆみ=Busur;えだ=Dahan;いと=Benang;こおり=Es Batu;さく=Mekar;あぶら=Minyak;くすり=Obat;パイプ=Pipa;ラップ=Plastik Wrap;こやし=Pupuk Kimia;ひりょう=Pupuk Organik;おんど=Suhu;こな=Serbuk;ねんりょう=Bahan Bakar;タンク=Drum Air;どうふん=Disel Semprot;ぐりんりふ=Sayur Hijau;ぐりんぼる=Kol Hijau;きのみ=Kacang-kacangan;びょう=Paku Maruchi;でんち=Baterai;だんぼ=Pemanas Ruangan;ぶむのみち=Jalan Traktor;ケトラー=Mobil Pick Up",
"Tambahan":"しゅうかぞう=Tempat Pengiriman;つろ=Jalan Traktor;ペーパー=Tissu;がじ=Alat Pemotong Rumput;ホウス=Hose;けゆう=Bensin;がスリン=Pertamax;きかい/エンジン=Mesin;ともろこっし=Jagung (variasi);きゅうりゅう=Timun (variasi);はって=Menempelkan;ポット=Memasukkan Tanah Ke Tore;ねこ=Akar;たちかま=Cangkul Kecil;サニーレタス=Daun Selada Merah;さび=Karat (hama jamur);あかさび=Jamur Tanaman;しろかくする=Membajak;かんきする=Membuka Tutup House;せんべつする=Memisahkan;くさとり=Mencabut Rumput;まく=Menebar;やさいとり=Mengambil Sayur;ロータリーする=Mengelola Tanah;じょうしょうじゅい=Mengobat Rumput;ねぎとりきかい=Mesin Panen Negi;かんそき=Mesin Pemanas;びぐる=Mesin Semprot Obat;かんりき=Mesin Menaikkan Tanah;あんきょう=Peresapan Air;ハウス=Rumah Plastik;ながいくつ=Sepatu Boot;ばいど=Tanah untuk Bibit;なえばこ=Tempat Bibit;とねる=Terowongan Plastik;みさき=Bunga Baru Tumbuh;かぐわしい=Harum Semerbak;かふんしょう=Alergi Serbuk Sari;つちとたいひをのせる=Menumpuk Tanah dan Pupuk;しょうさんカルシウム=Kalsium Nitrat;でんしサーモ=Termo Elektrik;ほうれんそう=Bayam;あかたまねぎ=Bawang Bombai Merah;ぼうちゅうネットむぎわらぼうし=Topi Jerami Anti Serangga;キャップ=Topi Cap;ガーデンスパイク=Sepatu Berkebun;ふゆのさぎょうふく=Pakaian Kerja Musim Dingin;なつのさぎょうふく=Pakaian Kerja Musim Panas;レインコート=Jas Hujan (Raincoat);のうぐようネット=Jaring Pertanian;ぼうちゅうサンサンネット=Penutup Anti Serangga;しゃねつネット=Jaring Penghalang Panas;ビニール=Vinil Penutup Greenhouse;カラーこうかん=Bambu Penyangga;パイプかしめき=Alat Perakit Pipa;ポットル=Pot Pembibitan;ミストエース=Semprotan Irigasi;ミストスプリンクラー=Mist Sprinkler;けっそくテープ=Isolasi Cangkok;さんぷようドローン=Drone Penyemprot;くうさつようドローン=Drone Udara;しょくぶつせいたいひ=Pupuk Organik Nabati;どうぶつせいたいひ=Kompos Hewan;のうぎょうようのベントナイト=Bentonite Pertanian;さっちゅうざい=Insektisida;てこうぐ=Peralatan Tangan;シルハツ=Cangkul Blencong;じょれん=Cangkul Tanah;さいえんようのこぎりかま=Sabit Gergaji Sayur;ガーデンクリーナー=Pembersih Taman;したあなひらけ=Pelubang Tanah;からぶり=Perata Tanah;トンボ=Perata Tanah (Tonbo);といし=Batu Asahan (Toishi);マルチカッター=Pemotong Mulsa;やさいけっそくき=Mesin Pengikat Tanaman;トラクタ=Traktor (Torakuta);たなッカー=Penyangga Rak;くろばんちゃん=Pasak Jaring;れいだんぼうそうふうき=Blower;トラックロープ=Tali Tambang;マット=Alas;つちのうぐブラシ=Sikat Pembersih Alat;びっちゅうくわ=Cangkul Garpu (Bitchu);あみ(serok)=Serok Sampah;いちりんしゃ(angkong)=Angkong",
"Sayur & Buah":"レタス=Selada;さにレタス=Selada Merah;はくさい=Sawi Putih;ロメインレタス=Sawi Kecil;だいこん=Lobak;ホーレンソー=Bayam;ブロッコリー=Brokoli;キャベツ=Kubis;まめ=Kacang;カリフラワー=Kembang Kol;じゃがいも=Kentang;とうもろこし=Jagung;おこめ=Beras;きゅうり=Timun;しょうが=Jahe;とうがらし=Cabe;なす=Terong;にんにく=Bawang Putih;たまねぎ=Bawang Bombai;ねぎ=Daun Bawang;にんじん=Wortel;きのこ=Jamur;トマト=Tomat;いちご=Stroberi;さつまいも=Ubi Jalar;かぼちゃ=Labu;にら=Kucai;ピーマン=Paprika;こまつな=Sawi Hijau;ちんげんさい=Pakcoy;すいか=Semangka;メロン=Melon;マンゴー=Mangga;りんご=Apel;ぶどう=Anggur;レモングラス=Sereh",
"Sifat & Arah":"まっすぐ=Lurus;まがる=Belok;ななめ=Miring;バック=Mundur;ぬれる=Basah;かわく=Kering;ふかい=Dalam;あさい=Dangkal;きたない=Kotor;よごれる=Kotor (Jorok);むこう=Paling Ujung;はんぶん=Setengah;まんなか=Tengah-tengah;ぜんぶ=Semua;くさってる=Busuk;かゆい=Gatal;ぼこぼこ=Tidak Datar;たいらに=Datarkan;まじる=Dicampur;かたい=Keras;やわらかい=Lembek;はんたい=Kebalikan;ぎゃく=Terbalik;あがる=Naik;さがる=Turun;さいご=Terakhir;りょうほう=Kedua-duanya;どけ=Minggir;じゅんばん=Urutan;じゅんび=Persiapan"};
const W=[];for(const c in D)D[c].split(";").forEach(s=>{const[i,j]=s.split("=");W.push({j:i,i:j,c,k:i})});
let mode="Kartu",known={},pool=[],idx=0,flip=false,score=0,tot=0,ans=false;
try{known=JSON.parse(localStorage.getItem("kv")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("kv",JSON.stringify(known))}catch(e){}};
const $=id=>document.getElementById(id);
const cat=$("cat");cat.innerHTML='<option>Semua</option>'+Object.keys(D).map(c=>`<option>${c}</option>`).join("")+'<option>Belum hafal</option>';
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const dir=()=>+$("dir").value;
const Q=w=>dir()?w.i:w.j, A=w=>dir()?w.j:w.i;
function filt(){const c=cat.value;return W.filter(w=>c=="Semua"||(c=="Belum hafal"?!known[w.k]:w.c==c))}
function reset(){pool=sh(filt());idx=0;flip=false;score=0;tot=0;ans=false;render()}
function prog(){const n=W.filter(w=>known[w.k]).length;$("prog").innerHTML=`<div class="sub">Hafal ${n} dari ${W.length} kata</div><div class="bar"><i style="width:${n/W.length*100}%"></i></div>`}
$("tabs").innerHTML=["Kartu","Kuis","Ketik","Daftar"].map(m=>`<button data-m="${m}">${m}</button>`).join("");
$("tabs").onclick=e=>{if(e.target.dataset.m){mode=e.target.dataset.m;reset()}};
cat.onchange=$("dir").onchange=reset;
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m==mode));prog();
 const v=$("view");
 if(mode=="Daftar"){const q=`<input id="s" placeholder="Cari kata...">`;v.innerHTML=q+'<table id="t"></table>';const f=()=>{const s=$("s").value.toLowerCase();$("t").innerHTML=filt().filter(w=>!s||w.j.includes(s)||w.i.toLowerCase().includes(s)).map(w=>`<tr><td>${esc(w.j)}</td><td>${esc(w.i)}</td><td class="tick" data-k="${esc(w.k)}">${known[w.k]?"✅":"⬜"}</td></tr>`).join("")};f();$("s").oninput=f;$("t").onclick=e=>{const k=e.target.dataset.k;if(k){known[k]=!known[k];sv();f();prog()}};return}
 if(!pool.length){v.innerHTML='<div class="card"><div class="big">Tidak ada kata</div></div>';return}
 if(idx>=pool.length){v.innerHTML=`<div class="card" style="cursor:default"><div class="big">Selesai 🎉</div>${tot?`<div class="sub">Skor ${score}/${tot}</div>`:""}</div><div class="acts"><button onclick="reset()">Ulangi</button></div>`;return}
 const w=pool[idx],h=`<div class="sub">${idx+1} / ${pool.length}</div>`;
 if(mode=="Kartu"){v.innerHTML=h+`<div class="card" id="cd"><div class="big">${esc(flip?A(w):Q(w))}</div><div class="sub">${flip?"":"ketuk untuk membalik"}</div></div><div class="acts"><button id="n">Belum hafal</button><button id="y">Hafal ✓</button></div>`;
  $("cd").onclick=()=>{flip=!flip;render()};$("n").onclick=()=>{known[w.k]=false;sv();idx++;flip=false;render()};$("y").onclick=()=>{known[w.k]=true;sv();idx++;flip=false;render()}}
 else if(mode=="Kuis"){const o=sh([w,...sh(W.filter(x=>x!=w&&A(x)!=A(w))).slice(0,3)]);ans=false;
  v.innerHTML=h+`<div class="card" style="cursor:default"><div class="big">${esc(Q(w))}</div></div><div class="opts">${o.map((x,i)=>`<button data-i="${i}">${esc(A(x))}</button>`).join("")}</div>`;
  v.querySelector(".opts").onclick=e=>{if(ans||!e.target.dataset.i)return;ans=true;tot++;const r=o[e.target.dataset.i]==w;if(r){score++;known[w.k]=true}else known[w.k]=false;sv();
   v.querySelectorAll(".opts button").forEach(b=>{if(o[b.dataset.i]==w)b.classList.add("ok")});if(!r)e.target.classList.add("no");setTimeout(()=>{idx++;render()},r?500:1400)}}
 else{ans=false;v.innerHTML=h+`<div class="card" style="cursor:default"><div class="big">${esc(Q(w))}</div></div><input id="a" autocomplete="off" autocapitalize="off" placeholder="Ketik jawaban..."><div class="msg" id="m"></div><div class="acts"><button id="go">Periksa</button></div>`;
  const nz=s=>s.toLowerCase().replace(/[\s\-]/g,"");const a=$("a");a.focus();
  const chk=()=>{if(ans){idx++;render();return}ans=true;tot++;const t=nz(a.value),c=nz(A(w)),r=t&&(t==c||c.split(/[\/(]/).some(p=>nz(p.replace(")",""))==t));
   if(r){score++;known[w.k]=true}else known[w.k]=false;sv();$("m").style.color=r?"var(--ok)":"var(--no)";$("m").textContent=r?"Benar ✓":"Jawaban: "+A(w);$("go").textContent="Lanjut"};
  $("go").onclick=chk;a.onkeydown=e=>{if(e.key=="Enter")chk()}}
}
reset();
</script></body></html>
